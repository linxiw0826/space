dataset_path: json
dataset_kwargs:
  data_files:
    test: /data2/wlx/data/ScanQA/scanqa_val.jsonl
task: scanqa
test_split: test
output_type: generate_until
doc_to_visual: !function utils.scanqa_doc_to_visual
doc_to_text: !function utils.scanqa_doc_to_text
doc_to_target: "answers"
generation_kwargs:
  max_new_tokens: 32
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
# Note that the metric name can be either a registed metric function (such as the case for GQA) or a key name returned by process_results
process_results: !function utils.scanqa_process_results
metric_list:
  - metric: scanqa_score
    aggregation: !function utils.scanqa_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "These are frames of a video showing an indoor scene."
    post_prompt: "Please answer the question using a single word or short phrase."
metadata:
  media_dir: /data2/wlx/data/VSIBench/scannet
  version: 0.0
